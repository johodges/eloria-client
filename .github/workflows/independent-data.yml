name: independent-data

on:
  pull_request:
  push:

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate complete independent data
        run: |
          python3 eloria-assets/tools/generate_all_assets.py build/eloria-data
      - name: Validate assets with Cal3D runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcal3d12-dev
          g++ -std=c++17 eloria-assets/tools/validate_cal3d_runtime.cpp -lcal3d -o /tmp/validate-cal3d
          /tmp/validate-cal3d build/eloria-data
      - name: Verify provenance policy
        run: python3 eloria-assets/tools/check_provenance.py
      - name: Verify original map
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          path = Path("build/eloria-data/maps/emberhaven.elm")
          data = path.read_bytes()
          assert data[:4] == b"elmf"
          assert struct.unpack_from("<ii", data, 4) == (32, 32)
          assert len(data) == 41752
          PY
      - name: Validate specialty-event assets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/eloria-data")
          events = json.loads((root / "special_event_assets.json").read_text())["events"]
          assert len(events) == 12
          assert len({event["icon"] for event in events}) == 12
          assert len({event["prop"] for event in events}) == 12
          for event in events:
              assert (root / event["icon"]).is_file()
              assert (root / event["prop"]).read_bytes()[:4] == b"e3dx"
          PY
      - name: Validate generated native E3D scenery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import struct
          root = Path("build/eloria-data")
          models = list(root.glob("3dobjects/**/*.e3d"))
          assert len(models) >= 223
          for path in models:
              data = path.read_bytes()
              magic, version, digest, offset = struct.unpack_from("<4s4s16si", data)
              assert magic == b"e3dx"
              assert version == bytes((1, 1, 0, 0))
              assert offset == 28
              assert hashlib.md5(data[offset:]).digest() == digest
              values = struct.unpack_from("<9i4B", data, offset)
              vertices, vertex_size, vertex_offset, indices, index_size, _, materials, material_size, material_offset, *_ = values
              assert vertices > 0 and indices > 0
              assert vertex_size == 32 and vertex_offset == 68
              assert index_size == 2
              assert materials == 1 and material_size == 172
              assert material_offset + 172 == len(data)
          PY
      - name: Validate generated Cal3D XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("build/eloria-data")
          paths = list(root.glob("actors/*.x?f")) + list(root.glob("animations/eloria/*.xaf"))
          for path in paths:
              lines = path.read_text().splitlines()
              assert lines[0].startswith("<HEADER MAGIC=")
              document = ET.fromstring("\n".join(lines[1:]))
              if path.suffix == ".xsf":
                  bones = document.findall("BONE")
                  assert bones
                  for bone in bones:
                      assert "NUMCHILD" in bone.attrib
                      assert "NUMCHILDS" not in bone.attrib
                      assert int(bone.attrib["NUMCHILD"]) == len(
                          bone.findall("CHILDID"))
          actors = ET.parse(root / "actor_defs/actor_defs.xml").getroot()
          player_ids = {0,1,2,3,4,5,37,38,39,40,41,42}
          player_actors = [actor for actor in actors.findall("actor")
                           if int(actor.attrib["id"]) in player_ids]
          assert len(player_actors) == 12
          assert {actor.attrib.get("race") for actor in player_actors} == {
              "luminous", "votary", "glasswarden", "orun", "greyhaven", "ssarathi"}
          none_ids = {"neck": 0, "helmet": 20, "cape": 30, "shield": 11}
          for actor in player_actors:
              for tag, none_id in none_ids.items():
                  assert actor.find(f"{tag}[@id='{none_id}']") is not None, (
                      actor.attrib["id"], tag, none_id)
          assert len(list(root.glob("animations/eloria/*.xaf"))) == 8
          assert len(list(root.glob("maps/**/*.elm"))) == 27
          assert len(list(root.glob("textures/items*.png"))) == 5
          PY
