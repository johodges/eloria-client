name: Four Gates Grounding Validation

on:
  push:
    branches:
      - codex/four-gates-grounding-fix2-20260827

permissions:
  contents: write

env:
  BASE_SHA: f81b5868b0d48869896ad595c6137278f6764403
  RESULT_BRANCH: codex/four-gates-grounding-result2-20260827
  MANIFEST: eloria-assets/maps/four-gates-city/four-gates-city.json

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 xvfb xauth libgl1-mesa-dri libfontconfig1 libxcursor1 \
            libxinerama1 libxrandr2 libxi6 libxkbcommon0 libasound2t64 \
            libpulse0 libudev1
      - name: Add rendered plateau walk surface
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('eloria-assets/maps/four-gates-city/four-gates-city.json')
          data = json.loads(path.read_text())
          nav = data.setdefault('navigation', {})
          prefixes = nav.setdefault('surfaceNodePrefixes', [])
          if 'Terrain_City_Plateau' not in prefixes:
              prefixes.append('Terrain_City_Plateau')
          path.write_text(json.dumps(data, indent=2) + '\n')
          assert data['navigation']['surfaceNodePrefixes'] == ['Terrain_City_Plateau']
          PY
      - name: Import Godot project
        run: godot --headless --path godot-client --editor --quit
      - name: Native asset catalog
        run: python3 godot-client/tests/test_native_glb_assets.py -v
      - name: Protocol and reducer fixtures
        run: godot --headless --path godot-client --script res://tests/test_protocol.gd
      - name: World input routing fixtures
        run: godot --headless --path godot-client --script res://tests/test_world_input.gd
      - name: Main scene smoke
        run: |
          godot --headless --path godot-client --quit-after 3 2>&1 | tee main-scene.log
          ! grep -E 'SCRIPT ERROR|Parse Error' main-scene.log
      - name: Four Gates loader smoke
        run: |
          godot --headless --path godot-client res://src/dev/world_validation.tscn --quit-after 12 2>&1 | tee world-scene.log
          ! grep -E 'SCRIPT ERROR|Parse Error' world-scene.log
      - name: Native character runtime smoke
        run: |
          godot --headless --path godot-client res://src/dev/model_validation.tscn --quit-after 12 2>&1 | tee model-scene.log
          ! grep -E 'SCRIPT ERROR|Parse Error' model-scene.log
      - name: Render Four Gates and legacy HUD
        env:
          ELORIA_ARTIFACT_DIR: ${{ github.workspace }}/godot-client/test-artifacts/four-gates-grounding
        run: |
          mkdir -p "$ELORIA_ARTIFACT_DIR"
          xvfb-run -a -s '-screen 0 1280x720x24' godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/rendered_four_gates_map.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/map.log"
          xvfb-run -a -s '-screen 0 1280x720x24' godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/rendered_legacy_hud.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/hud.log"
          ! grep -E 'SCRIPT ERROR|Parse Error|Unable to create DisplayServer|all display drivers failed' "$ELORIA_ARTIFACT_DIR/map.log" "$ELORIA_ARTIFACT_DIR/hud.log"
          test -s "$ELORIA_ARTIFACT_DIR/four-gates-aerial.png"
          test -s "$ELORIA_ARTIFACT_DIR/four-gates-gameplay.png"
          test -s "$ELORIA_ARTIFACT_DIR/legacy-hud.png"
          test -s "$ELORIA_ARTIFACT_DIR/legacy-hud-context-menu.png"
      - name: Upload rendered validation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-gates-grounding-validation
          path: godot-client/test-artifacts/four-gates-grounding
          if-no-files-found: warn

  publish-clean-result:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build clean one-file commit from validated base
        id: publish
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('eloria-assets/maps/four-gates-city/four-gates-city.json')
          data = json.loads(path.read_text())
          nav = data.setdefault('navigation', {})
          prefixes = nav.setdefault('surfaceNodePrefixes', [])
          if 'Terrain_City_Plateau' not in prefixes:
              prefixes.append('Terrain_City_Plateau')
          path.write_text(json.dumps(data, indent=2) + '\n')
          assert data['navigation']['surfaceNodePrefixes'] == ['Terrain_City_Plateau']
          PY
          git fetch origin "$BASE_SHA"
          git read-tree "$BASE_SHA"
          git add "$MANIFEST"
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='Eloria Migration Agent'
          export GIT_AUTHOR_EMAIL='actions@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'fix(godot): ground actors on rendered Four Gates plateau' | git commit-tree "$tree" -p "$BASE_SHA")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          git diff-tree --no-commit-id --name-status -r "$commit"
          changed=$(git diff-tree --no-commit-id --name-only -r "$commit" | wc -l)
          test "$changed" -eq 1
          test "$(git diff-tree --no-commit-id --name-only -r "$commit")" = "$MANIFEST"
          git push origin "$commit:refs/heads/$RESULT_BRANCH"
      - name: Report result
        run: echo "Clean result commit ${{ steps.publish.outputs.commit }} on $RESULT_BRANCH"
