name: Equipment Alignment Probe

on:
  push:
    branches:
      - codex/equipment-alignment-probe-20260827

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: barichello/godot-ci:4.7.2
    env:
      ELORIA_ARTIFACT_DIR: ${{ github.workspace }}/godot-client/test-artifacts/equipment-alignment
    steps:
      - uses: actions/checkout@v4
      - name: Install probe dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 xvfb xauth imagemagick libgl1-mesa-dri libfontconfig1 libxcursor1 \
            libxinerama1 libxrandr2 libxi6 libxkbcommon0 libasound2t64 libpulse0 libudev1
      - name: Configure six-piece alignment probe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('godot-client/src/dev/model_validation.gd')
          s = p.read_text()
          old = '''\tvar equipment_visuals: Dictionary = {} if is_creature else {0: 100, 1: 100}\n\tif id.begins_with("luminous_"):\n\t\tequipment_visuals.merge({4: 106, 5: 110, 6: 106})'''
          new = '''\tvar equipment_visuals: Dictionary = {} if is_creature else {0: 112, 1: 105, 2: 105}\n\tif id.begins_with("luminous_"):\n\t\tequipment_visuals.merge({4: 106, 5: 110, 6: 106})'''
          if old not in s:
              raise SystemExit('equipment probe marker missing')
          s = s.replace(old, new, 1)
          marker = '''\tvar equipment_diagnostics: Dictionary = actor.equipment_diagnostics()\n'''
          diag = '''\tvar equipment_diagnostics: Dictionary = actor.equipment_diagnostics()\n\tif actor._native_skeleton != null:\n\t\tfor bone_name: String in ["pelvis", "spine_02", "spine_03", "hand_r", "hand_l"]:\n\t\t\tvar bone_index: int = actor._native_skeleton.find_bone(bone_name)\n\t\t\tif bone_index >= 0:\n\t\t\t\tprint("ALIGN_BONE name=", bone_name, " rest=", actor._native_skeleton.get_bone_global_rest(bone_index), " pose=", actor._native_skeleton.get_bone_global_pose(bone_index))\n\tfor probe_part: int in [0, 1, 2, 4, 5, 6]:\n\t\tvar probe_nodes: Variant = actor._equipment_nodes.get(probe_part, [])\n\t\tif probe_nodes is Array:\n\t\t\tfor probe_node_value: Variant in probe_nodes as Array:\n\t\t\t\tvar probe_node: Node3D = probe_node_value as Node3D\n\t\t\t\tif not is_instance_valid(probe_node):\n\t\t\t\t\tcontinue\n\t\t\t\tprint("ALIGN_ATTACH part=", probe_part, " bone=", probe_node.get("bone_name"), " global=", probe_node.global_transform)\n\t\t\t\tfor mesh_value: Node in probe_node.find_children("*", "MeshInstance3D", true, false):\n\t\t\t\t\tvar mesh_node: MeshInstance3D = mesh_value as MeshInstance3D\n\t\t\t\t\tprint("ALIGN_MESH part=", probe_part, " aabb=", mesh_node.get_aabb(), " global=", mesh_node.global_transform)\n'''
          if marker not in s:
              raise SystemExit('diagnostic marker missing')
          p.write_text(s.replace(marker, diag, 1))
          PY
      - name: Import project
        run: godot --headless --path godot-client --editor --quit
      - name: Capture rest-pose alignment
        run: |
          mkdir -p "$ELORIA_ARTIFACT_DIR"
          xvfb-run -a -s "-screen 0 1280x720x24" bash -lc '
            godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility \
              --path godot-client res://src/dev/model_validation.tscn \
              >"$ELORIA_ARTIFACT_DIR/alignment.log" 2>&1 &
            pid=$!
            sleep 7
            import -window root "$ELORIA_ARTIFACT_DIR/alignment.png"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          '
          ! grep -E "SCRIPT ERROR|Parse Error|Unable to create DisplayServer|all display drivers failed" "$ELORIA_ARTIFACT_DIR/alignment.log"
          grep 'ALIGN_' "$ELORIA_ARTIFACT_DIR/alignment.log"
          test -s "$ELORIA_ARTIFACT_DIR/alignment.png"
      - name: Upload alignment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-alignment-probe
          path: godot-client/test-artifacts/equipment-alignment
          if-no-files-found: error
