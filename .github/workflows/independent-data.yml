name: Four Gates Surface Probe

on:
  push:
    branches:
      - codex/native-guard-evidence-20260827

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe rendered GLB surface at live actor position
        run: python3 .github/four_gates_surface_probe.py
      - name: Upload surface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-gates-surface-probe
          path: godot-client/test-artifacts/surface-probe
          if-no-files-found: error
