name: Guard alias tree reconstruction

on:
  push:
    branches:
      - codex/reconstruct-guard-alias-20260827

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused patch
        run: python3 .github/reconstruct_guard_alias.py
      - name: Verify portable compatibility checks
        run: |
          python3 -m json.tool godot-client/data/actors/equipment.json >/dev/null
          python3 godot-client/tests/test_native_glb_assets.py -v
          git diff --check
      - name: Publish clean temporary result
        run: |
          set -euo pipefail
          git checkout 91166040143d038b2cbaa34a26edc3d6465b1338 -- .github/workflows/independent-data.yml
          rm -f .github/workflows/reconstruct-guard-alias.yml .github/reconstruct_guard_alias.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/independent-data.yml \
                  .github/workflows/reconstruct-guard-alias.yml \
                  .github/reconstruct_guard_alias.py \
                  godot-client/data/actors/equipment.json \
                  godot-client/src/actors/replicated_actor_3d.gd \
                  godot-client/tests/test_native_glb_assets.py \
                  godot-client/docs/migration/TRACEABILITY.md
          git diff --cached --check
          git commit -m 'fix(godot): resolve legacy guard visuals to native gear'
          git push origin HEAD:codex/reconstruct-guard-alias-20260827
