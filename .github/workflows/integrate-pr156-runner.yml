name: Integrate PR156 into combined Godot branch

on:
  push:
    branches:
      - codex/integrate-pr156-runner-20260827

permissions:
  contents: write

jobs:
  merge-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge regional production map PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/native-guard-evidence-20260827 feature/godot-regional-production-maps
          git checkout -B codex/integrated-pr156-20260827 67316f5be4797aeaae6134884f0fb465f4d29561
          git merge --no-ff --no-commit 039565c19c558b8fb9eb73899b6ab7cf2e3b3cb5
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unexpected unresolved conflicts:"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git diff --check
      - name: Repair and validate regional concept boards
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check numpy pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          boards = sorted(Path('eloria-assets/maps/nymara-regions').glob('**/references/00-concept-detail-board.png'))
          if len(boards) != 18:
              raise SystemExit(f'expected 18 concept boards, found {len(boards)}')
          for path in boards:
              with Image.open(path) as image:
                  image.load()
                  repaired = image.convert('RGB')
              repaired.save(path, format='PNG', optimize=True)
              with Image.open(path) as check:
                  check.verify()
              print('repaired', path)
          PY
          python3 eloria-assets/tools/validate_nymara_region_maps.py
          python3 -m json.tool godot-client/data/maps/registry.json >/dev/null
          test -f eloria-assets/maps/nymara-regions/mirrorhold/world.glb
          test -f eloria-assets/maps/nymara-regions/manymouth_delta/world.glb
          git add eloria-assets/maps/nymara-regions
          git diff --check
          git commit -m "Merge Nymara regional production maps into combined Godot branch"
      - name: Publish clean integration result
        run: git push --force origin HEAD:codex/integrated-pr156-20260827
