name: Integrate PR156 into combined Godot branch

on:
  push:
    branches:
      - codex/integrate-pr156-runner-20260827

permissions:
  contents: write

jobs:
  merge-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge regional production map PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/native-guard-evidence-20260827 feature/godot-regional-production-maps codex/integrate-pr156-runner-20260827
          git show origin/codex/integrate-pr156-runner-20260827:.github/scripts/sanitize_pr156_concepts.py > /tmp/sanitize_pr156_concepts.py
          git checkout -B codex/integrated-pr156-20260827 67316f5be4797aeaae6134884f0fb465f4d29561
          git merge --no-ff --no-commit 039565c19c558b8fb9eb73899b6ab7cf2e3b3cb5
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unexpected unresolved conflicts:"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          python3 /tmp/sanitize_pr156_concepts.py
          git add -A eloria-assets godot-client
          git diff --check
      - name: Validate integrated regional production package
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check numpy pillow
          python3 eloria-assets/tools/validate_nymara_region_maps.py
          python3 -m json.tool godot-client/data/maps/registry.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('eloria-assets/maps/nymara-regions/validation-report.json').read_text())
          assert report['passed']
          assert report['summary']['productionRegions'] == 11
          assert report['summary']['conceptEvidenceMatches'] == 110
          assert report['summary']['sourceElmHashesMatched'] == 18
          assert report['summary']['conceptBoardsRegenerationRequired'] == 18
          assert not list(Path('eloria-assets/maps/nymara-regions').glob('**/references/00-concept-detail-board.png'))
          print(json.dumps(report['summary'], indent=2))
          PY
          test -f eloria-assets/maps/nymara-regions/mirrorhold/world.glb
          test -f eloria-assets/maps/nymara-regions/manymouth_delta/world.glb
          git add eloria-assets/maps/nymara-regions/validation-report.json
          git diff --check
          git commit -m "Merge Nymara regional production maps into combined Godot branch"
      - name: Publish clean integration result
        run: git push --force origin HEAD:codex/integrated-pr156-20260827
