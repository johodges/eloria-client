name: Godot Client

on:
  pull_request:
    paths:
      - "godot-client/**"
      - ".github/workflows/godot-client.yml"
  push:
    branches: [develop, feature/godot-client-migration]
    paths:
      - "godot-client/**"

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --path godot-client --editor --quit
      - name: Protocol and reducer fixtures
        run: godot --headless --path godot-client --script res://tests/test_protocol.gd
      - name: Main scene smoke test
        run: godot --headless --path godot-client --quit-after 3
      - name: Four Gates production loader smoke test
        run: godot --headless --path godot-client res://src/dev/world_validation.tscn --quit-after 12
      - name: Native character runtime smoke test
        run: godot --headless --path godot-client res://src/dev/model_validation.tscn --quit-after 12
