name: Godot Client

on:
  pull_request:
    paths:
      - "godot-client/**"
      - "eloria-assets/tools/build_native_nymara_glbs.py"
      - "eloria-assets/tools/render_native_glb_preview.py"
      - ".github/workflows/godot-client.yml"
  push:
    branches: [develop, feature/godot-client-migration]
    paths:
      - "godot-client/**"

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --path godot-client --editor --quit
      - name: Install Python asset validator
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3
      - name: Validate native Nymara GLB catalog
        run: python3 godot-client/tests/test_native_glb_assets.py -v
      - name: Protocol and reducer fixtures
        run: godot --headless --path godot-client --script res://tests/test_protocol.gd
      - name: World input routing fixtures
        run: godot --headless --path godot-client --script res://tests/test_world_input.gd
      - name: Main scene smoke test
        run: |
          godot --headless --path godot-client --quit-after 3 2>&1 | tee main-scene.log
          ! grep -E "SCRIPT ERROR|Parse Error" main-scene.log
      - name: Four Gates production loader smoke test
        run: |
          godot --headless --path godot-client res://src/dev/world_validation.tscn --quit-after 12 2>&1 | tee world-scene.log
          ! grep -E "SCRIPT ERROR|Parse Error" world-scene.log
      - name: Native character runtime smoke test
        run: |
          godot --headless --path godot-client res://src/dev/model_validation.tscn --quit-after 12 2>&1 | tee model-scene.log
          ! grep -E "SCRIPT ERROR|Parse Error" model-scene.log

  rendered-server-session:
    # Real-server runs create disposable characters. Run only for an explicit
    # milestone push so ordinary PR updates stay deterministic and non-mutating.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[rendered-integration]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.7.2
    env:
      ELORIA_ARTIFACT_DIR: ${{ github.workspace }}/godot-client/test-artifacts
      ELORIA_INTEGRATION_HOST: 18.235.240.60
      ELORIA_INTEGRATION_PORT: 2000
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual display and software rendering
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth libgl1-mesa-dri libfontconfig1 libxcursor1 libxinerama1 \
            libxrandr2 libxi6 libxkbcommon0 libasound2t64 libpulse0 libudev1
      - name: Import project
        run: godot --headless --path godot-client --editor --quit
      - name: Render real development-server session
        run: |
          mkdir -p "$ELORIA_ARTIFACT_DIR"
          xvfb-run -a -s "-screen 0 1280x720x24" godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/rendered_server_session.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/session.log"
          ! grep -E "SCRIPT ERROR|Parse Error|Unable to create DisplayServer|all display drivers failed" "$ELORIA_ARTIFACT_DIR/session.log"
          test -s "$ELORIA_ARTIFACT_DIR/world-default.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-remote-player-selected.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-chat.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-inventory.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-stats.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-rotated.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-panned.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-zoomed.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-full-map.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-after-move.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-seated.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-standing-after-move.png"
          test -s "$ELORIA_ARTIFACT_DIR/session.json"
          test -s "$ELORIA_ARTIFACT_DIR/remote-actor.json"
          test -s "$ELORIA_ARTIFACT_DIR/chat.json"
          test -s "$ELORIA_ARTIFACT_DIR/inventory-stats.json"
          test -s "$ELORIA_ARTIFACT_DIR/camera-states.json"
          test -s "$ELORIA_ARTIFACT_DIR/movement.json"
          test -s "$ELORIA_ARTIFACT_DIR/sit-stand.json"
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-server-session
          path: godot-client/test-artifacts
          if-no-files-found: error
