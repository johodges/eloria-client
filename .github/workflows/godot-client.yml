name: Godot Client

on:
  pull_request:
    paths:
      - "godot-client/**"
      - "eloria-assets/tools/build_native_nymara_glbs.py"
      - "eloria-assets/tools/build_native_sounds.py"
      - "eloria-assets/tools/render_native_glb_preview.py"
      - "eloria-assets/maps/four-gates-city/**"
      - "eloria-assets/maps/nymara-regions/sunmane_steppe/**"
      - "eloria-assets/tools/*four_gates*.py"
      - "eloria-assets/tools/sunmane/**"
      - ".github/workflows/godot-client.yml"
  push:
    branches: [develop, feature/godot-client-migration]
    paths:
      - "godot-client/**"

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --path godot-client --editor --quit
      - name: Install Python asset validator
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 python3-numpy
      - name: Validate native Nymara GLB catalog
        run: python3 godot-client/tests/test_native_glb_assets.py -v
      - name: Validate the generated sound set
        run: python3 godot-client/tests/test_native_sounds.py -v
      - name: Validate garment fit registry
        run: python3 godot-client/tests/test_equipment_fit.py -v
      - name: Validate world object models
        run: python3 godot-client/tests/test_world_object_models.py -v
      - name: Simulate and time the cape cloth
        run: godot --headless --path godot-client --script res://tests/test_cape_cloth.gd
      - name: Validate creature rigs, skinning and animation
        run: |
          python3 eloria-assets/tools/validate_creature_glbs.py \
            --catalog godot-client/data/actors/native_asset_catalog.json \
            --models godot-client/data/actors/models.json \
            --animations godot-client/data/animations/creature.json
      - name: Protocol and reducer fixtures
        run: godot --headless --path godot-client --script res://tests/test_protocol.gd
      - name: Invasion assistant UI fixtures
        run: godot --headless --path godot-client --script res://tests/test_invasion_assistant.gd
      - name: World input routing fixtures
        run: godot --headless --path godot-client --script res://tests/test_world_input.gd
      - name: Manifest lighting rig fixtures
        run: godot --headless --path godot-client --script res://tests/test_world_lighting.gd
      - name: Connection lifecycle fixtures
        run: godot --headless --path godot-client --script res://tests/test_connection_lifecycle.gd
      - name: HUD persistence fixtures
        run: godot --headless --path godot-client --script res://tests/test_hud_persistence.gd
      - name: Reference window fixtures
        run: godot --headless --path godot-client --script res://tests/test_reference_window.gd
      - name: Encyclopedia and attack-preview fixtures
        run: godot --headless --path godot-client --script res://tests/test_encyclopedia.gd
      - name: Localization and screenshot fixtures
        run: godot --headless --path godot-client --script res://tests/test_localization.gd
      - name: Settings window and key binding fixtures
        run: godot --headless --path godot-client --script res://tests/test_settings_window.gd
      - name: Console command fixtures
        run: godot --headless --path godot-client --script res://tests/test_console_commands.gd
      - name: Day and night cycle fixtures
        run: godot --headless --path godot-client --script res://tests/test_day_night.gd
      - name: Ambient audio binder fixtures
        run: godot --headless --path godot-client --script res://tests/test_ambient_audio.gd
      - name: Audio director fixtures
        run: godot --headless --path godot-client --script res://tests/test_audio_director.gd
      - name: Eloria extension window fixtures
        run: godot --headless --path godot-client --script res://tests/test_extension_windows.gd
      - name: Window drag and sit/stand icon fixtures
        run: godot --headless --path godot-client --script res://tests/test_window_drag.gd
      - name: Spells window fixtures
        run: godot --headless --path godot-client --script res://tests/test_spells_window.gd
      - name: Emotes window fixtures
        run: godot --headless --path godot-client --script res://tests/test_emotes_window.gd
      - name: Ranging window fixtures
        run: godot --headless --path godot-client --script res://tests/test_ranging_window.gd
      - name: Runtime cost fixtures
        run: godot --headless --path godot-client --script res://tests/test_runtime_performance.gd
      - name: Main scene smoke test
        run: |
          godot --headless --path godot-client --quit-after 3 2>&1 | tee main-scene.log
          ! grep -E "SCRIPT ERROR|Parse Error" main-scene.log
      - name: Four Gates production loader smoke test
        run: |
          godot --headless --path godot-client res://src/dev/world_validation.tscn --quit-after 12 2>&1 | tee world-scene.log
          ! grep -E "SCRIPT ERROR|Parse Error" world-scene.log
      - name: Native character runtime smoke test
        run: |
          godot --headless --path godot-client res://src/dev/model_validation.tscn --quit-after 12 2>&1 | tee model-scene.log
          ! grep -E "SCRIPT ERROR|Parse Error" model-scene.log
      - name: Sunmane Steppe package validation
        run: python3 eloria-assets/tools/sunmane/validate_package.py
      - name: Asset provenance
        run: python3 eloria-assets/tools/check_provenance.py
      - name: Sunmane Steppe grounding
        run: |
          godot --headless --path godot-client --script res://tests/integration/sunmane_grounding.gd 2>&1 | tee sunmane-grounding.log
          ! grep -E "SCRIPT ERROR|Parse Error|FAIL" sunmane-grounding.log
      - name: Sunmane Steppe traversal
        run: |
          godot --headless --path godot-client --script res://tests/integration/sunmane_traversal.gd 2>&1 | tee sunmane-traversal.log
          ! grep -E "SCRIPT ERROR|Parse Error|FAIL" sunmane-traversal.log

  rendered-four-gates-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: barichello/godot-ci:4.7.2
    env:
      ELORIA_ARTIFACT_DIR: ${{ github.workspace }}/godot-client/test-artifacts/four-gates
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual display and software rendering
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth libgl1-mesa-dri libfontconfig1 libxcursor1 libxinerama1 \
            libxrandr2 libxi6 libxkbcommon0 libasound2t64 libpulse0 libudev1
      - name: Import project
        run: godot --headless --path godot-client --editor --quit
      - name: Render Four Gates map views
        run: |
          mkdir -p "$ELORIA_ARTIFACT_DIR"
          xvfb-run -a -s "-screen 0 1280x720x24" godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/rendered_four_gates_map.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/render.log"
          ! grep -E "SCRIPT ERROR|Parse Error|Unable to create DisplayServer|all display drivers failed" "$ELORIA_ARTIFACT_DIR/render.log"
          test -s "$ELORIA_ARTIFACT_DIR/four-gates-aerial.png"
          test -s "$ELORIA_ARTIFACT_DIR/four-gates-gameplay.png"
          test -s "$ELORIA_ARTIFACT_DIR/four-gates-central-plaza-detail.png"
          test -s "$ELORIA_ARTIFACT_DIR/four-gates-south-gate-detail.png"
          test -s "$ELORIA_ARTIFACT_DIR/four-gates-market-detail.png"
          test -s "$ELORIA_ARTIFACT_DIR/four-gates-waterfall-detail.png"
      - name: Render legacy HUD and character menu
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/rendered_legacy_hud.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/legacy-hud.log"
          ! grep -E "SCRIPT ERROR|Parse Error|Unable to create DisplayServer|all display drivers failed" "$ELORIA_ARTIFACT_DIR/legacy-hud.log"
          test -s "$ELORIA_ARTIFACT_DIR/legacy-hud.png"
          test -s "$ELORIA_ARTIFACT_DIR/legacy-hud-context-menu.png"
          test -s "$ELORIA_ARTIFACT_DIR/legacy-hud-minimap.png"
          test -s "$ELORIA_ARTIFACT_DIR/legacy-full-map.png"
          test -s "$ELORIA_ARTIFACT_DIR/legacy-continent-map.png"
          test -s "$ELORIA_ARTIFACT_DIR/legacy-region-preview.png"
          test -s "$ELORIA_ARTIFACT_DIR/legacy-chat-console.png"
          test -s "$ELORIA_ARTIFACT_DIR/legacy-hud-settings.png"
      - name: Render all character-creation models
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/rendered_character_creation_models.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/character-models.log"
          if grep -E "SCRIPT ERROR|Parse Error|FAIL:|Unable to create DisplayServer|all display drivers failed" "$ELORIA_ARTIFACT_DIR/character-models.log"; then
            echo "Character-model render validation reported an error."
            exit 1
          fi
          grep -q "rendered character creation models: PASS" "$ELORIA_ARTIFACT_DIR/character-models.log"
          test -s "$ELORIA_ARTIFACT_DIR/default-00-luminous-female.png"
          test -s "$ELORIA_ARTIFACT_DIR/default-15-mycelari-male.png"
          test -s "$ELORIA_ARTIFACT_DIR/appearance-variant-3.png"
          test -s "$ELORIA_ARTIFACT_DIR/character-creation-ui.png"
          test -s "$ELORIA_ARTIFACT_DIR/validation.json"
      - name: Upload Four Gates rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-four-gates-map
          path: godot-client/test-artifacts/four-gates
          if-no-files-found: error

  rendered-phase0-repairs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.7.2
    env:
      ELORIA_ARTIFACT_DIR: ${{ github.workspace }}/godot-client/test-artifacts/phase0
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual display and software rendering
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             xvfb xauth libgl1-mesa-dri libfontconfig1 libxcursor1 libxinerama1             libxrandr2 libxi6 libxkbcommon0 libasound2t64 libpulse0 libudev1
      - name: Import project
        run: godot --headless --path godot-client --editor --quit
      - name: Render Phase 0 repair before/after pairs
        run: |
          mkdir -p "$ELORIA_ARTIFACT_DIR"
          xvfb-run -a -s "-screen 0 1280x720x24" godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/rendered_phase0_repairs.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/render.log"
          ! grep -E "SCRIPT ERROR|Parse Error|FAIL|Unable to create DisplayServer|all display drivers failed" "$ELORIA_ARTIFACT_DIR/render.log"
          grep -q "rendered phase 0 repairs: PASS" "$ELORIA_ARTIFACT_DIR/render.log"
          test -s "$ELORIA_ARTIFACT_DIR/marker-lights-before.png"
          test -s "$ELORIA_ARTIFACT_DIR/marker-lights-after.png"
          test -s "$ELORIA_ARTIFACT_DIR/console-history.png"
          test -s "$ELORIA_ARTIFACT_DIR/console-diagnostics.png"
          test -s "$ELORIA_ARTIFACT_DIR/server-popup.png"
          test -s "$ELORIA_ARTIFACT_DIR/harvest-targets-idle.png"
          test -s "$ELORIA_ARTIFACT_DIR/harvest-targets-active.png"
          test -s "$ELORIA_ARTIFACT_DIR/reading-progress.png"
          test -s "$ELORIA_ARTIFACT_DIR/reading-complete.png"
      - name: Render the Eloria extension windows
        run: |
          mkdir -p "$ELORIA_ARTIFACT_DIR"
          xvfb-run -a -s "-screen 0 1280x720x24" godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/rendered_extension_windows.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/extension-windows.log"
          ! grep -E "SCRIPT ERROR|Parse Error|FAIL|Unable to create DisplayServer|all display drivers failed" "$ELORIA_ARTIFACT_DIR/extension-windows.log"
          grep -q "rendered extension windows: PASS" "$ELORIA_ARTIFACT_DIR/extension-windows.log"
          test -s "$ELORIA_ARTIFACT_DIR/extension-windows-before.png"
          test -s "$ELORIA_ARTIFACT_DIR/extension-hud-readouts.png"
          test -s "$ELORIA_ARTIFACT_DIR/extension-quest-journal.png"
          test -s "$ELORIA_ARTIFACT_DIR/extension-mail.png"
          test -s "$ELORIA_ARTIFACT_DIR/extension-item-detail.png"
          test -s "$ELORIA_ARTIFACT_DIR/extension-merchant.png"
          test -s "$ELORIA_ARTIFACT_DIR/extension-player-info.png"
          test -s "$ELORIA_ARTIFACT_DIR/extension-quest-tracked.png"
          test -s "$ELORIA_ARTIFACT_DIR/extension-marketplace.png"
      - name: Render the Eternal Lands parity windows
        run: |
          mkdir -p "$ELORIA_ARTIFACT_DIR"
          xvfb-run -a -s "-screen 0 1280x720x24" godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/rendered_parity_windows.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/parity-windows.log"
          ! grep -E "SCRIPT ERROR|Parse Error|FAIL|Unable to create DisplayServer|all display drivers failed" "$ELORIA_ARTIFACT_DIR/parity-windows.log"
          grep -q "rendered parity windows: PASS" "$ELORIA_ARTIFACT_DIR/parity-windows.log"
          test -s "$ELORIA_ARTIFACT_DIR/parity-spells-window.png"
          test -s "$ELORIA_ARTIFACT_DIR/parity-emotes-window.png"
          test -s "$ELORIA_ARTIFACT_DIR/parity-ranging-window.png"
          test -s "$ELORIA_ARTIFACT_DIR/parity-settings-hud-tab.png"
      - name: Render server-placed map markers
        run: |
          mkdir -p "$ELORIA_ARTIFACT_DIR"
          xvfb-run -a -s "-screen 0 1280x720x24" godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/rendered_map_markers.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/map-markers.log"
          ! grep -E "SCRIPT ERROR|Parse Error|FAIL|Unable to create DisplayServer|all display drivers failed" "$ELORIA_ARTIFACT_DIR/map-markers.log"
          grep -q "rendered map markers: PASS" "$ELORIA_ARTIFACT_DIR/map-markers.log"
          test -s "$ELORIA_ARTIFACT_DIR/map-marker-before.png"
          test -s "$ELORIA_ARTIFACT_DIR/map-marker-full-map.png"
          test -s "$ELORIA_ARTIFACT_DIR/map-marker-gameplay-view.png"
      - name: Render the active-effect strip
        run: |
          mkdir -p "$ELORIA_ARTIFACT_DIR"
          xvfb-run -a -s "-screen 0 1280x720x24" godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/rendered_active_buffs.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/active-buffs.log"
          ! grep -E "SCRIPT ERROR|Parse Error|FAIL|Unable to create DisplayServer|all display drivers failed" "$ELORIA_ARTIFACT_DIR/active-buffs.log"
          grep -q "rendered active buffs: PASS" "$ELORIA_ARTIFACT_DIR/active-buffs.log"
          test -s "$ELORIA_ARTIFACT_DIR/active-buffs-before.png"
          test -s "$ELORIA_ARTIFACT_DIR/active-buffs-after.png"
          test -s "$ELORIA_ARTIFACT_DIR/active-buffs-removed.png"
      - name: Render the day and night cycle
        run: |
          mkdir -p "$ELORIA_ARTIFACT_DIR"
          xvfb-run -a -s "-screen 0 1280x720x24" godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/rendered_day_night.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/day-night.log"
          ! grep -E "SCRIPT ERROR|Parse Error|FAIL|Unable to create DisplayServer|all display drivers failed" "$ELORIA_ARTIFACT_DIR/day-night.log"
          grep -q "rendered day night: PASS" "$ELORIA_ARTIFACT_DIR/day-night.log"
          test -s "$ELORIA_ARTIFACT_DIR/day-night-before.png"
          test -s "$ELORIA_ARTIFACT_DIR/day-night-noon.png"
          test -s "$ELORIA_ARTIFACT_DIR/day-night-sunrise.png"
          test -s "$ELORIA_ARTIFACT_DIR/day-night-sunset.png"
          test -s "$ELORIA_ARTIFACT_DIR/day-night-midnight.png"
      - name: Render the screenshot binding
        run: |
          mkdir -p "$ELORIA_ARTIFACT_DIR"
          xvfb-run -a -s "-screen 0 1280x720x24" godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/rendered_screenshot.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/screenshot.log"
          ! grep -E "SCRIPT ERROR|Parse Error|FAIL|Unable to create DisplayServer|all display drivers failed" "$ELORIA_ARTIFACT_DIR/screenshot.log"
          grep -q "rendered screenshot: PASS" "$ELORIA_ARTIFACT_DIR/screenshot.log"
          test -s "$ELORIA_ARTIFACT_DIR/screenshot-binding.png"
      - name: Render world effects
        run: |
          mkdir -p "$ELORIA_ARTIFACT_DIR"
          xvfb-run -a -s "-screen 0 1280x720x24" godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/rendered_world_effects.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/world-effects.log"
          ! grep -E "SCRIPT ERROR|Parse Error|FAIL|Unable to create DisplayServer|all display drivers failed" "$ELORIA_ARTIFACT_DIR/world-effects.log"
          grep -q "rendered world effects: PASS" "$ELORIA_ARTIFACT_DIR/world-effects.log"
          test -s "$ELORIA_ARTIFACT_DIR/world-effect-before.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-effect-at-actor.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-effect-between-actors.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-effect-missile.png"
      - name: Render 16-bit actor native models
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/rendered_actor16_creature.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/actor16.log"
          ! grep -E "SCRIPT ERROR|Parse Error|FAIL|Unable to create DisplayServer|all display drivers failed" "$ELORIA_ARTIFACT_DIR/actor16.log"
          grep -q "rendered 16-bit actor evidence: PASS" "$ELORIA_ARTIFACT_DIR/actor16.log"
          test -s "$ELORIA_ARTIFACT_DIR/actor16-native.png"
          test -s "$ELORIA_ARTIFACT_DIR/actor16-fallback.png"
      - name: Upload Phase 0 rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-phase0-repairs
          path: godot-client/test-artifacts/phase0
          if-no-files-found: error

  rendered-sunmane-steppe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.7.2
    env:
      ELORIA_ARTIFACT_DIR: ${{ github.workspace }}/godot-client/test-artifacts/sunmane-steppe
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual display and software rendering
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth libgl1-mesa-dri libfontconfig1 libxcursor1 libxinerama1 \
            libxrandr2 libxi6 libxkbcommon0 libasound2t64 libpulse0 libudev1 python3-pil
      - name: Import project
        run: godot --headless --path godot-client --editor --quit
      - name: Render Sunmane Steppe concept views
        run: |
          mkdir -p "$ELORIA_ARTIFACT_DIR"
          xvfb-run -a -s "-screen 0 1280x720x24" godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/rendered_sunmane_steppe.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/render.log"
          ! grep -E "SCRIPT ERROR|Parse Error|Unable to create DisplayServer|all display drivers failed|FAIL" "$ELORIA_ARTIFACT_DIR/render.log"
          for view in aerial-overview p01-caravan-road p02-round-tent-camp \
              p03-seasonal-market p04-banner-shrine p05-caravanserai-gate \
              p06-windmill p07-well-and-pens p08-standing-stones \
              p09-steppe-overlook p10-market-props great-hall coast-southwest \
              mesa-north animal-pens gameplay-default; do
            test -s "$ELORIA_ARTIFACT_DIR/$view.png"
          done
      - name: Render minimap from the exported geometry
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/sunmane_minimap.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/minimap.log"
          ! grep -E "SCRIPT ERROR|Parse Error|FAIL" "$ELORIA_ARTIFACT_DIR/minimap.log"
      - name: Measure package performance
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/sunmane_performance.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/performance.log"
          ! grep -E "SCRIPT ERROR|Parse Error|FAIL" "$ELORIA_ARTIFACT_DIR/performance.log"
          test -s "$ELORIA_ARTIFACT_DIR/performance.json"
      - name: Build concept comparison sheets
        run: python3 eloria-assets/tools/sunmane/comparison.py
      - name: Upload Sunmane Steppe rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-sunmane-steppe
          path: godot-client/test-artifacts/sunmane-steppe
          if-no-files-found: error

  rendered-server-session:
    # Real-server runs create disposable characters. Run only for an explicit
    # milestone push so ordinary PR updates stay deterministic and non-mutating.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[rendered-integration]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.7.2
    env:
      ELORIA_ARTIFACT_DIR: ${{ github.workspace }}/godot-client/test-artifacts
      ELORIA_INTEGRATION_HOST: 18.235.240.60
      ELORIA_INTEGRATION_PORT: 2000
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual display and software rendering
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth libgl1-mesa-dri libfontconfig1 libxcursor1 libxinerama1 \
            libxrandr2 libxi6 libxkbcommon0 libasound2t64 libpulse0 libudev1
      - name: Import project
        run: godot --headless --path godot-client --editor --quit
      - name: Render real development-server session
        run: |
          mkdir -p "$ELORIA_ARTIFACT_DIR"
          xvfb-run -a -s "-screen 0 1280x720x24" godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/rendered_server_session.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/session.log"
          ! grep -E "SCRIPT ERROR|Parse Error|Unable to create DisplayServer|all display drivers failed" "$ELORIA_ARTIFACT_DIR/session.log"
          test -s "$ELORIA_ARTIFACT_DIR/world-default.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-remote-player-selected.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-chat.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-inventory.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-stats.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-equipment-fallback.png"
          test -s "$ELORIA_ARTIFACT_DIR/world-rotated.png"
