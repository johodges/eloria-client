name: Consolidate open PRs into Godot migration

on:
  push:
    branches:
      - codex/consolidate-open-prs-20260827

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge open PR heads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin \
            fix/four-gates-runtime-contracts \
            feature/godot-legacy-hud \
            fix/godot-character-creation-polish

          echo "=== merging PR #138 ==="
          git merge --no-ff --no-edit origin/fix/four-gates-runtime-contracts

          echo "=== merging PR #145 ==="
          if ! git merge --no-ff --no-edit origin/feature/godot-legacy-hud; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "PR #145 conflicts:"
            printf '%s\n' "$conflicts"
            if [ "$conflicts" != ".github/workflows/godot-client.yml" ]; then
              exit 1
            fi
            git checkout --ours .github/workflows/godot-client.yml
            git add .github/workflows/godot-client.yml
            git commit --no-edit
          fi

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/godot-client.yml')
          text = path.read_text()
          if 'Render legacy HUD and character menu' not in text:
              marker = '      - name: Upload Four Gates rendered evidence\n'
              step = '''      - name: Render legacy HUD and character menu\n        run: |\n          xvfb-run -a -s "-screen 0 1280x720x24" godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/rendered_legacy_hud.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/legacy-hud.log"\n          ! grep -E "SCRIPT ERROR|Parse Error|Unable to create DisplayServer|all display drivers failed" "$ELORIA_ARTIFACT_DIR/legacy-hud.log"\n          test -s "$ELORIA_ARTIFACT_DIR/legacy-hud.png"\n          test -s "$ELORIA_ARTIFACT_DIR/legacy-hud-context-menu.png"\n'''
              if marker not in text:
                  raise SystemExit('HUD workflow insertion marker missing')
              text = text.replace(marker, step + marker, 1)
              path.write_text(text)
          PY
          if ! git diff --quiet -- .github/workflows/godot-client.yml; then
            git add .github/workflows/godot-client.yml
            git commit -m "ci(godot): retain legacy HUD rendered evidence"
          fi

          echo "=== merging PR #146 ==="
          if ! git merge --no-ff --no-edit origin/fix/godot-character-creation-polish; then
            echo "=== PR #146 conflicts ==="
            git status --short
            echo "=== unresolved paths ==="
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git diff --check HEAD~5..HEAD
          git log --oneline --decorate -15
          git push origin HEAD:codex/consolidate-open-prs-result-20260827
