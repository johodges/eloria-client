name: Consolidate open PRs into Godot migration

on:
  push:
    branches:
      - codex/consolidate-open-prs-20260827

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge open PR heads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin \
            fix/four-gates-runtime-contracts \
            feature/godot-legacy-hud \
            fix/godot-character-creation-polish

          merge_one() {
            local ref="$1"
            local label="$2"
            echo "=== merging ${label}: ${ref} ==="
            if ! git merge --no-ff --no-edit "origin/${ref}"; then
              echo "=== conflicts while merging ${label} ==="
              git status --short
              echo "=== unresolved paths ==="
              git diff --name-only --diff-filter=U
              exit 1
            fi
          }

          merge_one fix/four-gates-runtime-contracts "PR #138"
          merge_one feature/godot-legacy-hud "PR #145"
          merge_one fix/godot-character-creation-polish "PR #146"

          git diff --check HEAD~3..HEAD || true
          git log --oneline --decorate -12
          git push origin HEAD:codex/consolidate-open-prs-result-20260827
