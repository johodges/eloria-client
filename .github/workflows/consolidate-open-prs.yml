name: Validate consolidated open PRs

on:
  push:
    branches:
      - codex/consolidate-open-prs-20260827

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/consolidate-open-prs-result-20260827
      - name: Install test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 xvfb xauth libgl1-mesa-dri libfontconfig1 libxcursor1 libxinerama1 \
            libxrandr2 libxi6 libxkbcommon0 libasound2t64 libpulse0 libudev1
      - name: Validate native GLBs
        run: python3 godot-client/tests/test_native_glb_assets.py -v
      - name: Import Godot project
        run: godot --headless --path godot-client --editor --quit
      - name: Protocol and reducer fixtures
        run: godot --headless --path godot-client --script res://tests/test_protocol.gd
      - name: World input fixtures
        run: godot --headless --path godot-client --script res://tests/test_world_input.gd
      - name: Main scene smoke
        run: |
          godot --headless --path godot-client --quit-after 3 2>&1 | tee main-scene.log
          ! grep -E "SCRIPT ERROR|Parse Error" main-scene.log
      - name: Render legacy HUD evidence
        run: |
          export ELORIA_ARTIFACT_DIR="$PWD/godot-client/test-artifacts/consolidated"
          mkdir -p "$ELORIA_ARTIFACT_DIR"
          xvfb-run -a -s "-screen 0 1280x720x24" godot --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --path godot-client --script res://tests/integration/rendered_legacy_hud.gd 2>&1 | tee "$ELORIA_ARTIFACT_DIR/legacy-hud.log"
          ! grep -E "SCRIPT ERROR|Parse Error|Unable to create DisplayServer|all display drivers failed" "$ELORIA_ARTIFACT_DIR/legacy-hud.log"
          test -s "$ELORIA_ARTIFACT_DIR/legacy-hud.png"
          test -s "$ELORIA_ARTIFACT_DIR/legacy-hud-context-menu.png"
