name: Portable world packages

on:
  pull_request:
    paths:
      - "world_package.*"
      - "world_glb_renderer.*"
      - "minimap.c"
      - "multiplayer.c"
      - "eloria-assets/tools/package_four_gates_world.py"
      - "tools/eloria-map-validate"
      - "tests/fixtures/world_package/**"
      - "tests/test_world_package_validator.py"
      - "tests/test_world_runtime_contracts.py"
      - ".github/workflows/world-package.yml"
  push:
    branches:
      - "feature/glb-json-world-maps"
    paths:
      - "world_package.*"
      - "world_glb_renderer.*"
      - "tools/eloria-map-validate"
      - "tests/fixtures/world_package/**"
      - "tests/test_world_package_validator.py"
      - ".github/workflows/world-package.yml"

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_world_package_validator -v
      - run: python3 tools/eloria-map-validate tests/fixtures/world_package/world.json --stats
      - run: python3 -m unittest tests.test_world_runtime_contracts -v
      - run: |
          python3 tools/generate_world_fixture.py
          git diff --exit-code -- tests/fixtures/world_package

  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          sudo apt update -qq
          sudo apt install -y cmake libsdl2-dev libsdl2-net-dev libsdl2-image-dev libssl-dev libopenal-dev libcal3d12-dev libvorbis-dev libsdl2-ttf-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLOCAL_NLOHMANN_JSON=ON -DGENERATE_ELORIA_DATA=OFF
      - run: cmake --build build --parallel 2
